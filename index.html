  return `<div class="tgroup${cls}"><div class="tgroup-head"><h2>${title}</h2><span>${note}</span>${action}</div>${body}</div>`;
}

function todoHeader() {
  const t = todos.filter(x => todoBucket(x) === 'today');
  const doneToday = t.filter(x => x.done).length;
  const left = t.filter(x => !x.done).length;
  $('#todoPct').textContent = `${doneToday} / ${t.length}`;
  $('#todoBar').style.width = (t.length ? doneToday / t.length * 100 : 0) + '%';
  $('#todoLine').textContent = left
    ? `今天还剩 ${left} 件`
    : '今天清空了';
}

const GROUPS = [
  ['today', '今天', '今天的都做完了'],
  ['tomorrow', '明天', '明天没有安排'],
  ['week', '本周内', '本周没有排期'],
  ['later', '以后', ''],
  ['done', '已完成', '']
];

function renderTodos() {
  todoHeader();
  let html = '';
  GROUPS.forEach(([key, title, empty]) => {
    const items = todos.filter(x => todoBucket(x) === key);
    if (!items.length && (key === 'later' || key === 'done' || !GROUPS.some(g => g[0] === key))) return;
    if (!items.length && key !== 'today' && key !== 'tomorrow' && key !== 'week') return;
    if (!items.length && !empty) return;
    items.sort((a, b) => new Date(a.due) - new Date(b.due));
    const note = key === 'done' ? `${items.length} 件`
      : key === 'today' ? `${items.filter(x => x.done).length} / ${items.length}`
      : `${items.length} 件`;
    const opts = key === 'done'
      ? {
          cls: 'is-done-group',
          action: '<button class="t-clear" type="button" data-act="clear-done">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 7h16M9.5 7V4.6h5V7M6.6 7l.9 12.1h9l.9-12.1M10.4 10.6v5.4M13.6 10.6v5.4"/></svg>清除</button>'
        }
      : {};
    html += groupHTML(title, items, note, empty || '没有内容', opts);
  });
  if (!html) html = groupHTML('今天', [], '0 / 0', '点右上角 + 加一件');
  $('#todoGroups').innerHTML = html;
  saveState();
}

let lastCleared = null;

/* 清除所有已勾选的待办，带一次可撤销 */
function clearDone() {
  const removed = todos.filter(t => t.done);
  if (!removed.length) { toast('还没有已完成的待办'); return; }
  const grp = document.querySelector('#todoGroups .is-done-group');
  if (grp && !RM) grp.classList.add('clearing');
  const apply = () => {
    todos = todos.filter(t => !t.done);
    lastCleared = removed;
    renderTodos();
    toast(`已清除 ${removed.length} 件已完成`, {
      label: '撤销',
      onClick: () => {
        if (!lastCleared) return;
        todos = todos.concat(lastCleared);
        lastCleared = null;
        renderTodos();
        toast('已恢复');
      }
    });
  };
  if (grp && !RM) setTimeout(apply, 210); else apply();
}

/* 完成之后：这一行自己滑到「已完成」的槽位里（FLIP，不换元素、不闪） */
function fallToDone(row, t) {
  const r0 = row.isConnected ? row.getBoundingClientRect() : null;
  renderTodos();
  const next = document.querySelector(`#todoGroups .task[data-id="${t.id}"]`);
  if (!next) return;

  const settle = () => {
    next.classList.remove('flying');
    next.classList.add('landed');
    setTimeout(() => next.classList.remove('landed'), 540);
  };

  if (!r0 || RM) { settle(); return; }

  const r1 = next.getBoundingClientRect();
  const dy = r0.top - r1.top;                    /* 反推：先把它摆回原位，再走回来 */
  if (Math.abs(dy) < 6) { settle(); return; }

  const dist = Math.abs(dy);
  const dur = Math.round(Math.min(880, 360 + dist * 0.52));
  next.classList.add('flying');
  const anim = next.animate([
    { transform: `translate3d(0,${dy}px,0) rotate(0deg)`, offset: 0,
      easing: 'cubic-bezier(.34,.01,.82,.42)' },
    { transform: `translate3d(0,${(dy * .34).toFixed(1)}px,0) rotate(.45deg)`, offset: .64,
      easing: 'cubic-bezier(.2,.7,.3,1)' },
    { transform: 'translate3d(0,0,0) rotate(0deg)', offset: 1 }
  ], { duration: dur, easing: 'linear', fill: 'none' });

  let done = false;
  const finish = () => { if (done) return; done = true; settle(); };
  anim.onfinish = finish;
  anim.oncancel = finish;
  setTimeout(finish, dur + 120);                 /* 兜底，防止后台标签页里 onfinish 不来 */
}

function completeTodo(row, checkEl) {
  const t = todos.find(x => x.id === row.dataset.id);
  if (!t) return;
  if (t.done) {                                  /* 取消完成：直接复原 */
    t.done = false;
    row.classList.remove('is-done');
    checkEl.classList.remove('done');
    checkEl.setAttribute('aria-checked', 'false');
    todoHeader();
    announce(`已取消：${t.text}`);
    return;
  }
  t.done = true;
  checkEl.classList.add('done');
  checkEl.setAttribute('aria-checked', 'true');
  row.classList.add('is-done');
  todoHeader();
  announce(`已完成：${t.text}`);
  clearTimeout(row._mv);
  row._mv = setTimeout(() => fallToDone(row, t), RM ? 80 : 660);
}

$('#todoGroups').addEventListener('click', e => {
  const clear = e.target.closest('[data-act="clear-done"]');
  if (clear) { e.preventDefault(); clearDone(); return; }
  const chk = e.target.closest('.check');
  if (!chk) return;
  completeTodo(chk.closest('.task'), chk);
});

/* 拖拽形变：拉伸 + 露出动作，松手过冲回弹 */
let sw = null;
const SPRING_OUT = 'cubic-bezier(.16,1.5,.4,1)';

$('#todoGroups').addEventListener('pointerdown', e => {
  const face = e.target.closest('.task-face');
  if (!face || e.target.closest('.check') || e.button !== 0) return;
  const row = face.closest('.task');
  sw = {
    row, face, id: row.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0,
    pid: e.pointerId, moved: false, axis: null,
    samples: [{ t: performance.now(), x: e.clientX }]
  };
  face.setPointerCapture?.(e.pointerId);
});
$('#todoGroups').addEventListener('pointermove', e => {
  const s = sw;
  if (!s || e.pointerId !== s.pid) return;
  const dx = e.clientX - s.x0, dy = e.clientY - s.y0;
  if (!s.moved && Math.hypot(dx, dy) > 8) {
    s.moved = true;
    s.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (!s.moved || s.axis !== 'x') return;
  s.dx = dx;
  s.samples.push({ t: performance.now(), x: e.clientX });
  while (s.samples.length > 2 && performance.now() - s.samples[0].t > 150) s.samples.shift();
  const capped = Math.abs(dx) > 150 ? Math.sign(dx) * (150 + (Math.abs(dx) - 150) * 0.28) : dx;
  s.face.style.transformOrigin = dx > 0 ? 'left center' : 'right center';
  s.face.style.transform = `translateX(${capped}px) scaleX(${(1 + Math.abs(capped) / 900).toFixed(3)})`;
  s.row.classList.toggle('show-left', dx > 6);
  s.row.classList.toggle('show-right', dx < -6);
});
function endSwipe(e) {
  const s = sw;
  if (!s || (e && e.pointerId !== s.pid)) return;
  sw = null;
  const v = winVelocity(s.samples);
  const commit = Math.abs(s.dx) > 110 || Math.abs(v) > 0.55;
  if (!s.moved) return;
  if (commit) {
    if (s.dx > 0) {
      const chk = s.face.querySelector('.check');
      s.row.classList.remove('show-left');
      s.face.style.transition = `transform ${RM ? 120 : 280}ms var(--ease)`;
      s.face.style.transform = 'translateX(0)';
      completeTodo(s.row, chk);
    } else {
      const row = s.row, h = row.offsetHeight;
      s.face.style.transition = 'none';
      const anim = row.animate(
        [{ height: h + 'px', opacity: 1, marginBottom: '9px' },
         { height: '0px', opacity: 0, marginBottom: '0px' }],
        { duration: RM ? 1 : 320, easing: 'cubic-bezier(.32,.86,.28,1)', fill: 'forwards' });
      anim.onfinish = () => {
        todos = todos.filter(x => x.id !== s.id);
        renderTodos();
        toast('已删除');
      };
    }
  } else {
    s.face.style.transition = `transform ${RM ? 140 : 620}ms ${SPRING_OUT}`;
    s.face.style.transform = 'translateX(0) scaleX(1)';
    s.row.classList.remove('show-left', 'show-right');
    setTimeout(() => {
      s.face.style.transition = '';
      s.face.style.transform = '';
      s.face.style.transformOrigin = '';
    }, RM ? 160 : 660);
  }
}
$('#todoGroups').addEventListener('pointerup', endSwipe);
$('#todoGroups').addEventListener('pointercancel', endSwipe);

/* ═══════════════ 账本 ═══════════════ */
let shownSpend = 0;

function monthTxs() {
  const d = NOW();
  return txs.filter(t => t.date.getMonth() === d.getMonth() && t.date.getFullYear() === d.getFullYear());
}
const sumOf = (arr, income) => arr.filter(t => !!t.income === income).reduce((s, t) => s + t.amt, 0);

function rollMoney(to) {
  const el = $('#moneySpend');
  const from = shownSpend;
  if (RM || Math.abs(to - from) < 0.005) { el.textContent = money(to); shownSpend = to; return; }
  const t0 = performance.now(), dur = 560;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = money(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else shownSpend = to;
  };
  requestAnimationFrame(step);
}

function renderBars() {
  const host = $('#bars');
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = dayAgo(i);
    const s = txs.filter(t => !t.income && sameDay(t.date, d)).reduce((a, b) => a + b.amt, 0);
    days.push({ d, s, today: i === 0 });
  }
  const max = Math.max(...days.map(x => x.s), 1);
  host.innerHTML = days.map(x =>
    `<i class="${x.today ? 'today' : ''}" style="height:${Math.max(8, Math.round(x.s / max * 100))}%"
      title="${x.d.getMonth() + 1}/${x.d.getDate()} ¥${money(x.s)}"></i>`).join('');
}

function renderCats() {
  const ex = monthTxs().filter(t => !t.income);
  const byCat = {};
  ex.forEach(t => { byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; });
  const list = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 4);
  $('#cats').innerHTML = list.map(([name, amt]) =>
    `<div class="cat"><u style="--cink:${catColor(name)}"></u><span>${esc(name)}</span>
      <b style="--cink:${catColor(name)}">${money(amt)}</b></div>`).join('');
}

function renderChips() {
  const all = ['全部', ...CATS.map(c => c.name)];
  $('#chips').innerHTML = all.map(n =>
    `<button type="button" class="chip${state.cat === n ? ' on' : ''}" role="tab"
      aria-selected="${state.cat === n}" data-cat="${esc(n)}">${esc(n)}</button>`).join('');
}

function dateLabel(d) {
  const y = dayAgo(1);
  if (sameDay(d, TODAY)) return '今天';
  if (sameDay(d, y)) return '昨天';
  return `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function renderTxList() {
  const list = monthTxs()
    .filter(t => state.cat === '全部' || t.cat === state.cat)
    .sort((a, b) => (b.date - a.date) || (b.time > a.time ? 1 : -1));
  const host = $('#txList');
  if (!list.length) {
    host.innerHTML = '<p class="empty">这个分类还没有记录</p>';
    return;
  }
  const groups = [];
  list.forEach(t => {
    const k = t.date.toDateString();
    let g = groups.find(x => x.k === k);
    if (!g) { g = { k, d: t.date, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  host.innerHTML = groups.map(g => {
    const out = g.items.filter(t => !t.income).reduce((s, t) => s + t.amt, 0);
    const inc = g.items.filter(t => t.income).reduce((s, t) => s + t.amt, 0);
    const total = `${out ? '− ¥' + money(out) : ''}${out && inc ? ' · ' : ''}${inc ? '+ ¥' + money(inc) : ''}`;
    return `<div class="tx-day"><span>${dateLabel(g.d)}</span><b>${total}</b></div>
      ${g.items.map(t => `
        <div class="tx">
          <span class="tx-ic${t.income ? ' inc' : ''}" style="${t.income ? '' : 'background:rgba(255,255,255,.05);color:' + catColor(t.cat)}">
            ${t.income ? '入' : esc(t.cat[0])}</span>
          <div class="tx-main">
            <div class="tx-name">${esc(t.note)}</div>
            <div class="tx-sub">${esc(t.cat)} · ${t.time}</div>
          </div>
          <span class="tx-amt${t.income ? ' up' : ''}">${t.income ? '+' : '−'} ${money(t.amt)}</span>
        </div>`).join('')}`;
  }).join('');
}

function renderLedger() {
  saveState();
  const m = monthTxs();
  const spend = sumOf(m, false), income = sumOf(m, true);
  rollMoney(spend);
  $('#moneyIncome').textContent = '¥' + money(income);
  $('#moneyLeft').textContent = '¥' + money(income - spend);
  const d = NOW();
  $('#monthLab').textContent = `${d.getMonth() + 1} 月`;
  $('#ledgerLine').textContent = `${d.getFullYear()} · ${d.getMonth() + 1} 月`;
  renderBars(); renderCats(); renderChips(); renderTxList();
}

  state.cat = c.dataset.cat;
  renderChips(); renderTxList();
});

let shDrag = null;
$('#sheetGrab').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  shDrag = { y0: e.clientY, dy: 0, pid: e.pointerId, samples: [] };
  $('#sheet').classList.add('drag');
  e.currentTarget.setPointerCapture?.(e.pointerId);
});
$('#sheetGrab').addEventListener('pointermove', e => {
  if (!shDrag || e.pointerId !== shDrag.pid) return;
  const dy = Math.max(0, e.clientY - shDrag.y0);
  shDrag.dy = dy;
  shDrag.samples.push({ t: performance.now(), x: e.clientY });
  while (shDrag.samples.length > 2 && performance.now() - shDrag.samples[0].t > 150) shDrag.samples.shift();
  $('#sheet').style.transform = `translateY(${dy}px)`;
});
function endSheetDrag(e) {
  if (!shDrag || (e && e.pointerId !== shDrag.pid)) return;
  const s = shDrag; shDrag = null;
  $('#sheet').classList.remove('drag');
  const v = winVelocity(s.samples);
  if (s.dy > 110 || v > 0.55) {

    $('#sheet').style.transition = `transform ${RM ? 120 : 380}ms var(--ease)`;

}

/* ═══════════════════════════════════════════════════════════
   自定义背景：预设光场 / 导入照片 / 遮罩 · 模糊 · 持久化
   ═══════════════════════════════════════════════════════════ */
const BG_IMG_KEY = 'kcb.bg';
const BG_CFG_KEY = 'kcb.bgcfg';

const bgState = { preset: 'midnight', src: '', veil: 0.62, blur: 0 };

function bgApply() {
  const phone = $('#phone');
  const layer = $('#bgLayer');
  const img = $('#bgImg');
  const veil = $('#bgVeil');
  if (!phone || !layer) return;

  layer.dataset.bg = bgState.preset;
  phone.dataset.bgstyle = bgState.preset;
  if (bgState.src) {
    img.style.backgroundImage = 'url("' + bgState.src + '")';
    img.style.filter = bgState.blur ? 'blur(' + bgState.blur + 'px)' : 'none';
  } else {
    img.style.backgroundImage = 'none';
  }
  phone.classList.toggle('has-photo', !!bgState.src);
  if (veil) veil.style.setProperty('--veil', String(bgState.veil));
}

function bgSave() {
  try {
    localStorage.setItem(BG_CFG_KEY, JSON.stringify({ preset: bgState.preset, veil: bgState.veil, blur: bgState.blur }));
    if (bgState.src) localStorage.setItem(BG_IMG_KEY, bgState.src);
    else localStorage.removeItem(BG_IMG_KEY);
  } catch (e) {
    toast('这张图太大，只留在本次打开期间（换张小一点的图可长期保存）');
  }
}

function bgLoad() {
  try {
    const cfg = JSON.parse(localStorage.getItem(BG_CFG_KEY) || 'null');
    if (cfg) {
      if (typeof cfg.preset === 'string') bgState.preset = cfg.preset;
      if (typeof cfg.veil === 'number') bgState.veil = cfg.veil;
      if (typeof cfg.blur === 'number') bgState.blur = cfg.blur;
    }
    const img = localStorage.getItem(BG_IMG_KEY);
    if (img) bgState.src = img;
  } catch (e) { /* 忽略 */ }
  if (bgState.src) bgState.preset = 'own';
  bgApply();
}

/* 把选中的图片压到 1400px 长边、逐步降质，控制 localStorage 体积 */
function bgReadFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) {
    toast('请选择图片文件');
    return;
  }
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const MAX = 1400;
    const scale = Math.min(1, MAX / Math.max(im.width, im.height));
    const w = Math.max(1, Math.round(im.width * scale));
    const h = Math.max(1, Math.round(im.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(im, 0, 0, w, h);
    let q = 0.82;
    let data = cv.toDataURL('image/jpeg', q);
    while (data.length > 2.6e6 && q > 0.46) {
      q -= 0.1;
      data = cv.toDataURL('image/jpeg', q);
    }
    URL.revokeObjectURL(url);
    bgState.src = data;
    bgState.preset = 'own';
    bgApply();
    bgSave();
    toast('背景已更新');
    if ($('#bgThumb')) $('#bgThumb').style.backgroundImage = 'url("' + data + '")';
    $$('.bg-sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bg === 'own')));
  };
  im.onerror = () => {
    URL.revokeObjectURL(url);
    toast('这张图读不出来，换一张试试');
  };
  im.src = url;
}

function openBg() {
  const presets = [
    ['midnight', '午夜'],
    ['aurora', '极光'],
    ['dusk', '暮橙'],
    ['graphite', '石墨']
  ];
  let album = '<div class="bg-presets">';
  presets.forEach(([k, label]) => {
    album += '<button class="bg-sw" type="button" data-bg="' + k + '" aria-pressed="' +
      String(bgState.preset === k || (k === 'midnight' && bgState.preset === 'none')) + '">' +
      '<span>' + label + '</span></button>';
  });
  album += '<button class="bg-sw bg-sw-own' + (bgState.src ? ' own' : '') + '" type="button" data-bg="own" ' +
    'id="bgThumb" aria-pressed="' + String(bgState.preset === 'own') + '"' +
    (bgState.src ? ' style="background-image:url(\'' + bgState.src + '\')"' : '') + '>' +
    '<span>' + (bgState.src ? '我的' : '我的图') + '</span></button>';
  album += '</div>';

  const body = album +
    '<button class="bg-upload" type="button" id="bgPick">' +
      '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3.6"/><circle cx="8.6" cy="9.6" r="1.5"/><path d="M4.4 16.6l4.5-4.2 3.4 3.1 2.9-2.7 4.4 4"/></svg>' +
      '从相册选一张图' +
    '</button>' +
    '<div class="bg-slider"><div class="bg-slider-head"><b>压暗遮罩</b><i id="bgVeilVal">' + Math.round(bgState.veil * 100) + '%</i></div>' +
      '<input type="range" id="bgVeil" min="0" max="92" step="1" value="' + Math.round(bgState.veil * 100) + '" aria-label="背景压暗程度"></div>' +
    '<div class="bg-slider"><div class="bg-slider-head"><b>背景模糊</b><i id="bgBlurVal">' + bgState.blur + 'px</i></div>' +
      '<input type="range" id="bgBlur" min="0" max="16" step="1" value="' + bgState.blur + '" aria-label="背景模糊半径"></div>' +
    '<p class="bg-note">图片会缩到长边 1400px 后再存到本机，不上传任何服务器。遮罩调低能看清照片，调高文字更清楚。</p>';

  openSheet({
    title: '背景',
    sub: '换成预设光场或你自己的照片 —— 卡片是玻璃的，会把背景透出来',
    body,
    foot: '<button class="btn btn-primary" id="bgDone">完成</button>'
  });

  const pick = $('#bgPick');
  pick.onclick = () => $('#bgFile').click();

  $$('#sheetBody .bg-sw').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.bg;
      $$('#sheetBody .bg-sw').forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      if (k === 'own') {
        if (!bgState.src) { toast('还没有选图，先点下面的按钮'); return; }
        bgState.preset = 'own';
      } else {
        bgState.preset = k;
      }
      bgApply();
      bgSave();
    };
  });

  const v = $('#bgVeil');
  v.oninput = () => {
    bgState.veil = (+v.value) / 100;
    $('#bgVeilVal').textContent = v.value + '%';
    bgApply();
  };
  v.onchange = bgSave;

  const bl = $('#bgBlur');
  bl.oninput = () => {
    bgState.blur = +bl.value;
    $('#bgBlurVal').textContent = bl.value + 'px';
    bgApply();
  };
  bl.onchange = bgSave;

  $('#bgDone').onclick = () => { closeSheet(); bgSave(); };
}

/* 拖一张图片到手机框里 */
function bgWireDrop() {
  const phone = $('#phone');
  let depth = 0;
  phone.addEventListener('dragenter', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    depth++;
    phone.classList.add('drop-hint');
  });
  phone.addEventListener('dragover', e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  phone.addEventListener('dragleave', () => {
    depth = Math.max(0, depth - 1);
    if (!depth) phone.classList.remove('drop-hint');
  });
  phone.addEventListener('drop', e => {
    e.preventDefault();
    depth = 0;
    phone.classList.remove('drop-hint');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) bgReadFile(f);
  });
}

$('#bgFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) bgReadFile(f);
  e.target.value = '';
});

/* ═══════════════ 旋钮（跟手 + 惯性 + 吸附刻度 + 过档反馈） ═══════════════ */
const buzz = () => { try { navigator.vibrate?.(8); } catch (_) {} };

function buildKnob(el, o) {
  const min = o.min ?? 0, max = o.max ?? 60, step = o.step ?? 5;
  let val = clamp(o.value ?? 15, min, max);
  const CX = 86, CY = 86, R = 70, SW = 270, A0 = 135;
  const pt = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  const arcD = (a1, a2, r) => {
    const [x1, y1] = pt(a1, r), [x2, y2] = pt(a2, r);
    const large = Math.abs(a2 - a1) > 180 ? 1 : 0;
    return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
  };
  const vals = [];
  for (let v = min; v <= max + 0.001; v += step) vals.push(Math.round(v));

  let ticks = '';
  vals.forEach(v => {
    const a = A0 + SW * (v - min) / (max - min);
    const major = v % 15 === 0;
    const [x1, y1] = pt(a, major ? 55 : 58.5), [x2, y2] = pt(a, 66);
    ticks += `<line class="ktick${major ? ' major' : ''}" data-v="${v}"
      x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
  });

  el.innerHTML = `<svg viewBox="0 0 172 172" aria-hidden="true">
      <path class="kring" d="${arcD(A0, A0 + SW, R)}"/>
      <path class="kprog" d=""/>
      <g class="kticks">${ticks}</g>
      <circle class="kthumb" cx="${CX}" cy="${CY}" r="7"/>
    </svg>
    <div class="kz"><div class="knum">${val}</div><div class="kunit">${o.unit || '分钟'}</div></div>`;

  const prog = el.querySelector('.kprog');
  const thumb = el.querySelector('.kthumb');
  const num = el.querySelector('.knum');
  const tickEls = Array.from(el.querySelectorAll('.ktick'));

  el.setAttribute('role', 'slider');
  el.tabIndex = 0;
  el.setAttribute('aria-valuemin', min);
  el.setAttribute('aria-valuemax', max);

  function draw(v) {
    val = v;
    const a = A0 + SW * (v - min) / (max - min);
    prog.setAttribute('d', v <= min + 0.01 ? '' : arcD(A0, a, R));
    const [tx, ty] = pt(a, R);
    thumb.setAttribute('cx', tx.toFixed(2));
    thumb.setAttribute('cy', ty.toFixed(2));
    num.textContent = Math.round(v);
    tickEls.forEach(t => t.classList.toggle('lit', +t.dataset.v <= v + 0.001));
    el.setAttribute('aria-valuenow', String(Math.round(v)));
    el.setAttribute('aria-valuetext', `${Math.round(v)} 分钟`);
  }
  draw(val);

  function tweenTo(target) {
    target = clamp(Math.round(target / step) * step, min, max);
    const from = val;
    if (RM || Math.abs(target - from) < 0.01) {
      draw(target); o.onChange?.(val); o.onCommit?.(val); return;
    }
    const t0 = performance.now(), dur = 300;
    let lastQ = Math.floor(from / step);
    const run = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      draw(from + (target - from) * e);
      const q = Math.floor(val / step);
      if (q !== lastQ) { lastQ = q; buzz(); }
      o.onChange?.(val);
      if (k < 1) requestAnimationFrame(run);
      else { draw(target); o.onChange?.(val); o.onCommit?.(val); }
    };
    requestAnimationFrame(run);
  }

  let drag = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const ang = Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
    drag = { pid: e.pointerId, cx, cy, last: ang, acc: 0, v0: val, q: Math.floor(val / step),
             samples: [{ t: performance.now(), x: val }] };
    el.classList.add('drag');
  });
  el.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const ang = Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx) * 180 / Math.PI;
    let d = ang - drag.last;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    drag.acc += d;
    drag.last = ang;
    draw(clamp(drag.v0 + drag.acc / SW * (max - min), min, max));
    const q = Math.floor(val / step);
    if (q !== drag.q) { drag.q = q; buzz(); }
    o.onChange?.(val);
    drag.samples.push({ t: performance.now(), x: val });
    while (drag.samples.length > 2 && performance.now() - drag.samples[0].t > 120) drag.samples.shift();
  });
  function release(e) {
    if (!drag || (e && e.pointerId !== drag.pid)) return;
    const v = winVelocity(drag.samples);
    drag = null;
    el.classList.remove('drag');
    tweenTo(val + v * 190);
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('lostpointercapture', () => { if (drag) release(null); });
  el.addEventListener('keydown', e => {
    const k = e.key;
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(k)) return;
    e.preventDefault();
    if (k === 'Home') tweenTo(min);
    else if (k === 'End') tweenTo(max);
    else tweenTo(val + (k === 'ArrowRight' || k === 'ArrowUp' ? step : -step));
  });

  return {
    get value() { return Math.round(val); },
    set(v) { draw(clamp(v, min, max)); o.onChange?.(val); o.onCommit?.(val); },
    glide: tweenTo
  };
}

/* ═══════════════ 导入课程表 ═══════════════ */
const DAYMAP = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 7, 天: 7 };
const SAMPLE_TXT = `周一 1-2节 高等数学 A301 张老师
周一 3-4节 大学英语 B204 王老师
周二 1-2节 数据结构 C402 陈立
周二 5-6节 大学物理 D101 赵敏
周三 3-4节 概率论 B302 刘芳老师
周四 1-2节 计算机网络 A401 孙浩`;
const INFO_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5.4M12 8.1v.6"/></svg>`;

function hashColor(s) {
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 4;
  return h;
}

function parseCourses(text) {
  const out = [];
  text.split(/\n+/).forEach(raw => {
    let line = raw.replace(/[,，;；\/|\t]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!line || /^(名称|课程名|name|课程)/i.test(line)) return;
    let day = 0, p0 = 0, p1 = 0, room = '', teacher = '', m;
    if ((m = line.match(/(?:周|星期|礼拜)\s*([一二三四五六日天])/))) { day = DAYMAP[m[1]]; line = line.replace(m[0], ' '); }
    else if ((m = line.match(/^([1-7])(?=\s)/))) { day = +m[1]; line = line.replace(m[0], ' '); }
    if ((m = line.match(/第?\s*(\d{1,2})\s*[-–~至]\s*(\d{1,2})\s*节?/))) { p0 = +m[1]; p1 = +m[2]; line = line.replace(m[0], ' '); }
    else if ((m = line.match(/第\s*(\d{1,2})\s*节/))) { p0 = p1 = +m[1]; line = line.replace(m[0], ' '); }
    if ((m = line.match(/([A-Za-z]?\d{3,4}|[^\s]{1,6}(?:楼|室|教|馆|场|厅|中心))(?=\s|$)/))) { room = m[1]; line = line.replace(m[0], ' '); }
    if ((m = line.match(/([^\s]{1,3}(?:老师|教授))/))) { teacher = m[1].replace(/老师|教授/, ''); line = line.replace(m[0], ' '); }
    const name = line.replace(/\s+/g, ' ').trim();
    if (!name || !day || !p0) return;
    out.push({ name, day, p: clamp(Math.ceil(p0 / 2) - 1, 0, 4), room, teacher, color: hashColor(name) });
  });
  return out;
}

let txAmt = '', txCat = '餐饮';

function openTx() {
  txAmt = ''; txCat = '餐饮';
  openSheet({
    title: '记一笔',
    sub: '金额、分类、备注，三步就完',
    body: `<div class="amt"><small>¥</small><b id="txAmt" class="zero">0</b></div>
      <div class="cat-grid" id="txCats">${CATS.map(c =>
        `<button type="button" class="cat-cell${c.name === txCat ? ' on' : ''}" data-cat="${c.name}"
          style="--cink:${c.c}" role="radio" aria-checked="${c.name === txCat}">
          <span class="radio"><i></i></span>
          <span class="cdot"></span>
          <span>${c.name}</span></button>`).join('')}</div>
      <input class="field" id="txNote" placeholder="备注（可选）" maxlength="20"
        aria-label="备注" style="margin-top:12px">
      <div class="pad" id="txPad">${PAD_KEYS.map(k =>
        `<button type="button" class="${k === '⌫' ? 'zero' : ''}" data-k="${k}"
          aria-label="${k === '⌫' ? '退格' : k}">${k}</button>`).join('')}</div>`,
    foot: `<button class="btn btn-primary btn-full" id="txSave">保存这一笔</button>`,
    mount(body, foot) {
      const setAmt = () => {
        const el = $('#txAmt');
        el.textContent = txAmt || '0';
        el.classList.toggle('zero', !txAmt || txAmt === '0');
      };
      const press = k => {
        if (k === '⌫') txAmt = txAmt.slice(0, -1);
        else if (k === '.') { if (!txAmt.includes('.')) txAmt = (txAmt || '0') + '.'; }
        else {
          if (txAmt.replace('.', '').length >= 7) return;
          const dec = txAmt.split('.')[1];
          if (dec && dec.length >= 2) return;
          txAmt = txAmt === '0' ? k : txAmt + k;
        }
        setAmt();
      };
      $('#txPad').onclick = e => {
        const b = e.target.closest('button[data-k]');
        if (b) press(b.dataset.k);
      };
      $('#txCats').onclick = e => {
        const b = e.target.closest('.cat-cell');
        if (!b) return;
        txCat = b.dataset.cat;
        $$('#txCats .cat-cell').forEach(x => {
          const on = x.dataset.cat === txCat;
          x.classList.toggle('on', on);
          x.setAttribute('aria-checked', String(on));
        });
      };
      $('#txSave').onclick = () => {
        const amt = parseFloat(txAmt);
        if (!amt || amt <= 0) { toast('先输入金额'); return; }
        const d = new Date();
        txs.unshift({
          id: 'x' + (++txSeq), date: d,
          time: `${pad2(d.getHours())}:${pad2(d.getMinutes())}`,
          cat: txCat, note: ($('#txNote')?.value || '').trim() || txCat, amt, income: false
        });
        state.cat = '全部';
        closeSheet();
        renderLedger();
        const fresh = $('#txList .tx');
        if (fresh) {
          fresh.classList.add('fresh');
          setTimeout(() => fresh.classList.remove('fresh'), 520);
        }
        toast(`已记账 ¥${money(amt)}`);
        announce(`已记录一笔 ${txCat} 支出 ${money(amt)} 元`);
      };
    }
  });
}

          <div class="pick-row" id="ntTimeRow">${timeChips}</div>
        </div>
      </div>`,
    foot: `<button class="btn btn-ghost btn-wide" id="ntCancel">取消</button>
      <button class="btn btn-primary btn-full" id="ntSave">添加</button>`,
    mount() {
      const dateEl = $('#ntDate'), timeEl = $('#ntTime');
      const syncDay = () => {
        dateEl.value = ntDate;
        $$('#ntDayRow .chip').forEach(x => {
          x.classList.toggle('on', ymd(atTime(+x.dataset.day, '00:00')) === ntDate);
        });
      };
      const syncTime = () => {
        timeEl.value = ntTime;
        $$('#ntTimeRow .chip').forEach(x => x.classList.toggle('on', x.dataset.time === ntTime));
      };
      syncDay(); syncTime();

      $('#ntTagRow').onclick = e => {
        const b = e.target.closest('.chip');
        if (!b) return;
        ntTag = b.dataset.tag;
        $$('#ntTagRow .chip').forEach(x => x.classList.toggle('on', x === b));
      };
      $('#ntDayRow').onclick = e => {
        const b = e.target.closest('.chip');
        if (!b) return;
        ntDate = ymd(atTime(+b.dataset.day, '00:00'));
        syncDay();
      };
      dateEl.onchange = () => { if (dateEl.value) { ntDate = dateEl.value; syncDay(); } };
      $('#ntTimeRow').onclick = e => {
        const b = e.target.closest('.chip');
        if (!b) return;
        ntTime = b.dataset.time;
        syncTime();
      };
      timeEl.onchange = () => { if (timeEl.value) { ntTime = timeEl.value; syncTime(); } };

      $('#ntCancel').onclick = closeSheet;
      const save = () => {
        const text = $('#ntText').value.trim();
        if (!text) { toast('写点内容'); $('#ntText').focus(); return; }
        const [Y, M, D] = (ntDate || ymd(new Date())).split('-').map(Number);
        const [h, m] = (ntTime || '18:00').split(':').map(Number);
        const due = new Date(Y, M - 1, D, h, m, 0, 0);
        if (isNaN(due.getTime())) { toast('日期没填对'); return; }

        setTab('todo');

        toast(`已添加 · ${dueLabel(due)}`);
        announce(`已添加待办：${text}，${dueLabel(due)}`);

    }
  });
}

      <div class="det-remind-top"><h3>上课提醒</h3><span>到点弹出提醒横幅</span></div>
      <div class="knob-wrap">
        <div class="knob" id="knob1" aria-label="这门课提前多少分钟提醒"></div>
        <p class="ktip">上课前 <em id="kNum1">${c.remind}</em> 分钟提醒</p>
        <div class="kpresets" id="kpre1">${[5, 10, 15, 30].map(v =>
          `<button type="button" class="kpreset${v === c.remind ? ' on' : ''}" data-v="${v}">${v} 分钟</button>`).join('')}</div>
      </div>
    </section>

    <div class="det-sec"><h3>课程信息</h3>
      <div class="det-rows">
        <div class="det-row-item"><span>课程代码</span><b>${(c.name.length * 137 % 900 + 100)}-${c.day}</b></div>
        <div class="det-row-item"><span>上课时间</span><b>周${DAYN[c.day]} ${s.n} 节 · ${hhmm(s.start)}–${hhmm(s.end)}</b></div>
        <div class="det-row-item"><span>地点</span><b>${esc(c.room)}</b></div>
        <div class="det-row-item"><span>教师</span><b>${esc(c.teacher)}</b></div>
        <div class="det-row-item"><span>考核方式</span><b>期末 60% · 平时 40%</b></div>
      </div>
    </div>

    <div class="det-sec"><h3>课程简介</h3>
      <p class="det-intro">本课程围绕${esc(c.name)}的核心概念展开，每周两次课，配合课后习题与实验。
        课程资料会随进度更新，缺勤记录同步到教务系统。</p>
    </div>

    <div class="det-sec"><h3>课程资料</h3>
      <div class="det-mats">${MATS.map(([n, sz]) =>
        `<button type="button" class="det-mat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 3.6h6.6L19 9.2v11.2H7z"/><path d="M13.4 3.6v5.8H19"/></svg>
          ${esc(n)}<span style="color:var(--faint);font-size:10.5px">${sz}</span></button>`).join('')}
      </div>
    </div>`;

  detKnob = buildKnob($('#knob1'), {
    value: c.remind, unit: '分钟',
    onChange: v => {
      const r = Math.round(v);
      $('#kNum1').textContent = r;
      $$('#kpre1 .kpreset').forEach(b => b.classList.toggle('on', +b.dataset.v === r));
    },
    onCommit: v => { detRemind = Math.round(v); }
  });
  $('#kpre1').onclick = e => {
    const b = e.target.closest('.kpreset');
    if (!b) return;
    detRemind = +b.dataset.v;
    detKnob.glide(detRemind);
  };
  $$('#detScroll .det-mat').forEach(b => b.onclick = () => toast('原型里打不开附件'));

  $('#detail').classList.add('on');
  phone.classList.add('detail-open');
  $('#detScroll').scrollTop = 0;
  requestAnimationFrame(() => $('#detBack').focus({ preventScroll: true }));
  announce(`${c.name} 课程资料`);
}

function closeDetail() {
  const el = $('#detail');
  if (!el.classList.contains('on')) return;
  el.classList.remove('on', 'drag');
  el.style.transform = '';
  phone.classList.remove('detail-open');
  state.openId = null;
  if (state.lastFocus && state.lastFocus.focus) state.lastFocus.focus({ preventScroll: true });
}

$('#detBack').addEventListener('click', closeDetail);
$('#detSave').addEventListener('click', () => {
  const c = courses.find(x => x.id === state.openId);
  if (!c) return;
  const name = $('#detName').value.trim();
  if (name) c.name = name;
  c.remind = detRemind;
  toast(`已保存 · 提前 ${c.remind} 分钟提醒`);
  announce(`已保存 ${c.name}`);

  renderCourseAll();
});
$('#detTest').addEventListener('click', () => {

});
$('#detMore').addEventListener('click', () => toast('导出 / 分享 / 删除：原型未实现'));

/* 资料页下拉关闭 */
let detDrag = null;
$('#detBar').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  /* 按在按钮上时不接管指针：一旦 setPointerCapture，click 会被重定向到把手本身，
     返回键就永远收不到点击（这就是「返回键点不动」的原因）。 */
  if (e.target.closest('button, a, input, textarea, select')) return;
  detDrag = { y0: e.clientY, dy: 0, pid: e.pointerId, live: false };
});
$('#detBar').addEventListener('pointermove', e => {
  if (!detDrag || e.pointerId !== detDrag.pid) return;
  const dy = Math.max(0, e.clientY - detDrag.y0);
  if (!detDrag.live) {
    if (dy < 8) return;               /* 8px 内不开启拖拽，避免误吞点击 */
    detDrag.live = true;
    $('#detBar').setPointerCapture?.(e.pointerId);
  }
  detDrag.dy = dy;
  $('#detail').classList.add('drag');
  $('#detail').style.transform = `translateY(${dy}px)`;
});
function endDetDrag(e) {
  if (!detDrag || (e && e.pointerId !== detDrag.pid)) return;
  const s = detDrag; detDrag = null;
  $('#detail').classList.remove('drag');
  if (!s.live) return;
  if (s.dy > 110) {
    $('#detail').style.transform = '';
    closeDetail();
  } else {
    $('#detail').style.transition = `transform ${RM ? 120 : 380}ms var(--ease)`;
    $('#detail').style.transform = '';
    setTimeout(() => { $('#detail').style.transition = ''; }, RM ? 140 : 400);
  }
}
$('#detBar').addEventListener('pointerup', endDetDrag);
$('#detBar').addEventListener('pointercancel', endDetDrag);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#detail').classList.contains('on')) closeDetail();
    else if ($('#sheet').classList.contains('on')) closeSheet();
  }
});

/* ═══════════════ 仿系统通知横幅 ═══════════════ */
let bannerTimer = null;
function showBanner(c, minutes) {
  const s = slotOf(c);
  $('#bannerKicker').textContent = minutes > 0 ? `课程提醒 · 提前 ${minutes} 分钟` : '课程提醒 · 马上开始';
  $('#bannerTime').textContent = hhmm(s.start);

  $('#bannerSub').textContent = `${hhmm(s.start)}–${hhmm(s.end)} · ${c.room} 教室 · ${c.teacher}`;
  const b = $('#banner');
  b.classList.add('on');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('on'), 5200);
  announce(`${c.name} 提醒：${hhmm(s.start)} 在 ${c.room} 上课`);
}
$('#banner').addEventListener('click', () => {
  const id = courses.find(c => c.name === $('#bannerName').textContent)?.id;
  $('#banner').classList.remove('on');
  if (id) openDetail(id);
});
let bDrag = null;
$('#banner').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  bDrag = { y0: e.clientY, pid: e.pointerId };
  $('#banner').classList.add('drag');
});
$('#banner').addEventListener('pointermove', e => {
  if (!bDrag || e.pointerId !== bDrag.pid) return;
  const dy = Math.min(0, e.clientY - bDrag.y0);
  $('#banner').style.transform = `translateY(${dy}px)`;
  if (dy < -24) { $('#banner').classList.remove('on'); }
});
function endBDrag() {
  if (!bDrag) return;
  bDrag = null;
  $('#banner').classList.remove('drag');
  $('#banner').style.transform = '';
}
$('#banner').addEventListener('pointerup', endBDrag);
$('#banner').addEventListener('pointercancel', endBDrag);

/* ═══════════════ 吸边工具条 ═══════════════ */
const qt = { x: 0, y: 0, dock: 'right', min: false, drag: null, idle: null };

function qPlace(x, y) {
  const el = $('#qtool');
  const pr = phone.getBoundingClientRect();
  const w = el.offsetWidth || 46, h = el.offsetHeight || 150;
  qt.x = clamp(x, 6, pr.width - w - 6);
  qt.y = clamp(y, pr.height * 0.1, pr.height - h - 92);
  el.style.left = qt.x + 'px';
  el.style.top = qt.y + 'px';
}
function qDock(silent) {
  const el = $('#qtool');
  const pr = phone.getBoundingClientRect();
  const w = el.offsetWidth || 46;
  qt.x = qt.dock === 'right' ? pr.width - w - 8 : 8;
  el.classList.add('docked');
  qPlace(qt.x, qt.y);
  if (!silent) {
    const msg = qt.dock === 'right' ? '工具条已停靠右侧' : '工具条已停靠左侧';
    $('#qdockStatus').textContent = msg;
  }
}
function qWake() {
  clearTimeout(qt.idle);
  if (qt.min) {
    qt.min = false;
    $('#qtool').classList.remove('min');
    requestAnimationFrame(() => qDock(true));
  }
  qt.idle = setTimeout(() => {
    if (qt.drag) return;
    qt.min = true;
    $('#qtool').classList.add('min');
    requestAnimationFrame(() => qDock(true));
  }, 4200);
}

$('#qgrab').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  qt.drag = { x0: e.clientX, y0: e.clientY, lx: qt.x, ly: qt.y, moved: false, pid: e.pointerId };
  e.currentTarget.setPointerCapture?.(e.pointerId);
  clearTimeout(qt.idle);
});
$('#qgrab').addEventListener('pointermove', e => {
  const d = qt.drag;
  if (!d || e.pointerId !== d.pid) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved && Math.hypot(dx, dy) > 4) {
    d.moved = true;
    $('#qtool').classList.add('drag');
  }
  if (!d.moved) return;
  qPlace(d.lx + dx, d.ly + dy);
  const pr = phone.getBoundingClientRect();
  qt.dock = (qt.x + ($('#qtool').offsetWidth || 46) / 2) < pr.width / 2 ? 'left' : 'right';
});
function endQDrag() {
  const d = qt.drag;
  if (!d) return;
  qt.drag = null;
  $('#qtool').classList.remove('drag');
  if (d.moved) {
    qDock(false);
  } else {
    qt.min = !qt.min;
    $('#qtool').classList.toggle('min', qt.min);
    requestAnimationFrame(() => qDock(true));
  }
  qWake();
}
$('#qgrab').addEventListener('pointerup', endQDrag);
$('#qgrab').addEventListener('pointercancel', endQDrag);
$('#qgrab').addEventListener('lostpointercapture', () => { if (qt.drag) endQDrag(); });
$('#qgrab').addEventListener('keydown', e => {
  const map = { ArrowLeft: [-15, 0], ArrowRight: [15, 0], ArrowUp: [0, -15], ArrowDown: [0, 15] };
  if (!map[e.key]) return;
  e.preventDefault();
  const [dx, dy] = map[e.key];
  const pr = phone.getBoundingClientRect();
  const el = $('#qtool');
  qPlace(qt.x + dx, qt.y + dy);
  qt.dock = (qt.x + el.offsetWidth / 2) < pr.width / 2 ? 'left' : 'right';
  qDock(false);
});
$('#qtool').addEventListener('pointerenter', qWake);

/* ═══════════════ 导出到系统日历（.ics） ═══════════════ */
const ICS_DAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];

function icsPad(n) { return (n < 10 ? '0' : '') + n; }

/* 本地浮动时间：不带 Z，手机按自己时区解释，跨时区也不会错位 */
function icsLocal(d) {
  return d.getFullYear() + icsPad(d.getMonth() + 1) + icsPad(d.getDate()) +
    'T' + icsPad(d.getHours()) + icsPad(d.getMinutes()) + '00';
}
function icsUTC(d) {
  return d.getUTCFullYear() + icsPad(d.getUTCMonth() + 1) + icsPad(d.getUTCDate()) +
    'T' + icsPad(d.getUTCHours()) + icsPad(d.getUTCMinutes()) + icsPad(d.getUTCSeconds()) + 'Z';
}
function icsEsc(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
    .replace(/\r?\n/g, '\\n');
}
/* RFC 5545：每行不超过 75 字节，按字符边界折行（中文一个字 3 字节） */
function icsFold(line) {
  const parts = [];
  let cur = '', bytes = 0;
  for (const ch of line) {
    const b = new TextEncoder().encode(ch).length;
    if (bytes + b > 73) { parts.push(cur); cur = ' ' + ch; bytes = 1 + b; }
    else { cur += ch; bytes += b; }
  }
  parts.push(cur);
  return parts.join('\r\n');
}

/* 本周内下一次该星期的日期（今天已过点就顺延一周）；minutes = 当天第几分钟 */
function icsNextDate(day, minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  const now = new Date();
  const target = day % 7;                       /* 1..7 → 周一..周日；7%7=0 即周日 */
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
  let delta = (target - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + delta);
  if (d.getTime() <= now.getTime()) d.setDate(d.getDate() + 7);
  return d;
}

function buildICS() {
  const L = [];
  const stamp = icsUTC(new Date());
  L.push('BEGIN:VCALENDAR');
  L.push('VERSION:2.0');
  L.push('PRODID:-//KCB//课程·待办·账本//CN');
  L.push('CALSCALE:GREGORIAN');
  L.push('METHOD:PUBLISH');
  L.push('X-WR-CALNAME:课程与待办');
  L.push('X-WR-TIMEZONE:Asia/Shanghai');

  /* 课程：按周重复 16 次，每次提前 N 分钟响 */
  courses.forEach(c => {
    const p = PERIODS[c.p] || PERIODS[0];
    const start = icsNextDate(c.day, p.start);
    const end = icsNextDate(c.day, p.end);
    L.push('BEGIN:VEVENT');
    L.push('UID:course-' + c.id + '@kcb.local');
    L.push('DTSTAMP:' + stamp);
    L.push('DTSTART:' + icsLocal(start));
    L.push('DTEND:' + icsLocal(end));
    L.push('RRULE:FREQ=WEEKLY;COUNT=16');
    L.push('SUMMARY:' + icsEsc(c.name));
    L.push('LOCATION:' + icsEsc(c.room || ''));
    L.push('DESCRIPTION:' + icsEsc(
      [c.teacher ? '教师：' + c.teacher : '', p.n + ' 节 ' + hhmm(p.start) + '–' + hhmm(p.end)]
        .filter(Boolean).join('\n')));
    L.push('BEGIN:VALARM');
    L.push('ACTION:DISPLAY');
    L.push('DESCRIPTION:' + icsEsc(c.name + ' ' + c.room));
    L.push('TRIGGER:-PT' + (c.remind || state.remindDefault || 15) + 'M');
    L.push('END:VALARM');
    L.push('END:VEVENT');
  });

  /* 未完成的待办：单次事件，到点提醒 */
  todos.filter(t => !t.done && t.due).forEach(t => {
    const d = new Date(t.due);
    if (isNaN(d)) return;
    const end = new Date(d.getTime() + 30 * 60000);
    L.push('BEGIN:VEVENT');
    L.push('UID:todo-' + t.id + '@kcb.local');
    L.push('DTSTAMP:' + stamp);
    L.push('DTSTART:' + icsLocal(d));
    L.push('DTEND:' + icsLocal(end));
    L.push('SUMMARY:' + icsEsc('☐ ' + t.text));
    L.push('DESCRIPTION:' + icsEsc(t.tag || '待办'));
    L.push('BEGIN:VALARM');
    L.push('ACTION:DISPLAY');
    L.push('DESCRIPTION:' + icsEsc(t.text));
    L.push('TRIGGER:PT0M');
    L.push('END:VALARM');
    L.push('END:VEVENT');
  });

  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

function exportICS() {
  const ics = buildICS();
  const name = '课程与待办-' + ymd(new Date()) + '.ics';
  try {
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('日历文件已生成 · 打开它导入');
    announce('已导出 ' + courses.length + ' 门课程与 ' +
      todos.filter(t => !t.done).length + ' 条待办');
  } catch (err) {
    toast('导出失败：' + err.message);
  }
}
